server:
  addr: ":8080"
  admin_username: "admin"
  # 留空则首次启动生成随机密码，打印一次并写入 data/admin-password.txt
  admin_password: ""
  session_ttl: 12h
  # 反向代理终止 TLS 时，把反代地址加入可信列表，用于解析真实客户端 IP
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # 反代未传 X-Forwarded-Proto 时，可强制 Cookie 带 Secure
  secure_cookie: false
  # 可选：为 /metrics 设置访问令牌；留空则公开
  metrics_token: ""
  # 上游 Key 的加密主密钥（base64 或 hex 的 32 字节）；留空则自动生成
  # 到数据库目录的 master.key，务必与数据库一起备份
  master_key: ""
  read_header_timeout: 10s
  shutdown_timeout: 30s
  max_body_bytes: 33554432

database:
  path: "./data/llmgw.db"

log:
  level: info
  format: json

providers:
  # 内置端点：只需选 preset + 填 API Key。
  # 国内套餐用 minimax-mplan-cn（api.minimax.cn），国际套餐用 minimax-mplan-global。
  - name: minimax-cn
    preset: minimax-mplan-cn
    api_key: "${MINIMAX_KEY}"
    # 可选：覆盖内置默认模型（默认 MiniMax-M3.1-Flash）
    # models:
    #   - MiniMax-M3.1-Flash

  # 自定义端点：任意 code plan 都是「一个 Key + 1~2 个 base URL + 模型」。
  - name: glm
    api_key: "${GLM_KEY}"
    models:
      - glm-4.6
    openai_base_url: https://open.bigmodel.cn/api/coding/paas/v4
    anthropic_base_url: https://open.bigmodel.cn/api/anthropic

# 可选。USD per million tokens，仅用于成本估算。
pricing:
  MiniMax-M3.1-Flash:
    input_per_mtok: 0.3
    output_per_mtok: 1.2
  glm-4.6:
    input_per_mtok: 0.6
    output_per_mtok: 2.2
