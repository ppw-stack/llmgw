# Local test environment: gateway + deterministic mock upstream.
# Credentials here are test-only; never reuse them in production.

server:
  addr: ":8080"
  admin_username: admin
  admin_password: "test-admin-password"
  metrics_token: "test-metrics-token"
  session_ttl: 2h
  trusted_proxies: ["127.0.0.1/32"]
  secure_cookie: false

database:
  path: "/data/llmgw.db"

log:
  level: debug
  format: text

instances:
  - name: mock
    api_key: "mock-upstream-key"
    endpoints:
      - protocol: openai
        base_url: http://mock:8000
      - protocol: anthropic
        base_url: http://mock:8000
    models: [gpt-test, claude-test, gpt-upstream-name]

models:
  - name: gpt-test
    upstream: gpt-test
    instances:
      - name: mock
  - name: claude-test
    upstream: claude-test
    instances:
      - name: mock
  - name: gpt-alias
    upstream: gpt-upstream-name
    instances:
      - name: mock

pricing:
  gpt-test:
    input_per_mtok: 1
    output_per_mtok: 2
  claude-test:
    input_per_mtok: 3
    output_per_mtok: 15
