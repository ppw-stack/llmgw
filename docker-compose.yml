services:
  llmgw:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    image: llmgw:${VERSION:-dev}
    container_name: llmgw
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/llmgw/config.yaml:ro
      - llmgw-data:/data
    environment:
      # 上游 Key 通过环境变量注入，避免写进配置文件
      GLM_KEY_1: ${GLM_KEY_1:-}
      GLM_KEY_2: ${GLM_KEY_2:-}
      DEEPSEEK_KEY: ${DEEPSEEK_KEY:-}
      # 首次启动生成的密码会写到挂载卷里的 admin-password.txt
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "llmgw", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  llmgw-data:
