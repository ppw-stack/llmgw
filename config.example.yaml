server:
  addr: ":8080"
  admin_username: "admin"
  # 留空则首次启动生成随机密码，打印一次并写入 data/admin-password.txt
  admin_password: ""
  session_ttl: 12h
  # 反向代理终止 TLS 时，把反代地址加入可信列表，用于解析真实客户端 IP
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # 反代未传 X-Forwarded-Proto 时，可强制 Cookie 带 Secure
  secure_cookie: false
  # 可选：为 /metrics 设置访问令牌；留空则公开
  metrics_token: ""
  # 上游 Key 的加密主密钥（base64 或 hex 的 32 字节）；留空则自动生成
  # 到数据库目录的 master.key，务必与数据库一起备份
  master_key: ""
  read_header_timeout: 10s
  shutdown_timeout: 30s
  max_body_bytes: 33554432

database:
  path: "./data/llmgw.db"

log:
  level: info
  format: json

# 上游调用的全局超时：约束非流式请求与流式响应的空闲间隔。
# 单个实例可以用 timeout_secs 调低（不能调高）。
upstream_timeout: 120s

# 调度相关的全局设置。
# timezone 是所有时间窗口的判定时区：默认 Asia/Shanghai，
# 也支持 "UTC"、IANA 名称（如 "America/New_York"）或固定偏移（如 "+08:00"）。
schedule:
  timezone: "Asia/Shanghai"

# 上游接入点（物理层）：一个账号 + 它提供的协议入口。
# 这里不写分流策略——策略属于下面的模型层。
instances:
  # 内置端点：端点地址由程序内置，随版本升级自动更新。
  # 国内套餐用 minimax-mplan-cn（api.minimax.cn），国际套餐用 minimax-mplan-global。
  # 另外还有 opencode-go（OpenCode Go 订阅）与 ark-coding-plan-cn（火山方舟 Coding Plan）。
  - name: minimax-cn
    preset: minimax-mplan-cn
    api_key: "${MINIMAX_KEY}"
    # 必填：这个账号能服务哪些上游模型名。模型引用它时必须在此列表内。
    models: [MiniMax-M3.1-Flash]
    # 熔断：连续失败 max_fails 次后跳过该实例 cooldown_secs 秒
    max_fails: 3
    cooldown_secs: 30
    # 单实例超时（秒）；0 表示用上面的全局 upstream_timeout
    timeout_secs: 0

  # 同一个上游地址的两个账号，构成主备：
  # 两者都可以服务同一个模型，靠模型的 priority 决定谁先被调用。
  - name: minimax-cn-backup
    preset: minimax-mplan-cn
    api_key: "${MINIMAX_KEY_BACKUP}"
    models: [MiniMax-M3.1-Flash]
    max_fails: 3
    cooldown_secs: 30

  # OpenCode Go 订阅（端点地址由程序内置：opencode.ai/inference/go）。
  # 上游强制要求每个请求带 x-opencode-session，缺失直接返回 400 MissingSessionID；
  # 网关原样透传客户端请求头，自带会话头的客户端（Claude Code / Codex / ZCode / Pi）可直接用。
  - name: opencode-go
    preset: opencode-go
    api_key: "${OPENCODE_GO_KEY}"
    models: [glm-5.3, kimi-k3]

  # 火山方舟 Coding Plan（端点地址由程序内置：…/api/coding）。
  # 只有 /api/coding 系列地址才扣套餐额度，/api/v3 不扣额度而是另外计费。
  #
  # 套餐额度（5 小时 / 每周 / 每月）只在账号管控面上，推理用的 API Key 读不到，
  # 需要另外填一对火山引擎访问密钥（控制台 → 访问控制 → API 访问密钥）。
  - name: ark-coding
    preset: ark-coding-plan-cn
    api_key: "${ARK_API_KEY}"
    quota_credential:
      access_key_id: "${VOLC_ACCESS_KEY_ID}"
      secret_access_key: "${VOLC_SECRET_ACCESS_KEY}"
    models: [ark-code-latest, doubao-seed-2.1-pro]

  # 自定义端点：任意 code plan 都是「一个 Key + 1~2 个端点」。
  - name: glm
    api_key: "${GLM_KEY}"
    endpoints:
      - protocol: openai
        base_url: https://open.bigmodel.cn/api/coding/paas/v4
      - protocol: anthropic
        base_url: https://open.bigmodel.cn/api/anthropic
    models: [glm-4.6]

  # 支持错峰计费的厂商：谷时价格更低，用时间窗口让它在谷时插队。
  - name: deepseek
    api_key: "${DEEPSEEK_KEY}"
    endpoints:
      - protocol: openai
        base_url: https://api.deepseek.com/v1
    models: [deepseek-chat]

  # 同一个对外模型的另一个上游，平时用它，谷时让 deepseek 插队。
  - name: moonshot
    api_key: "${MOONSHOT_KEY}"
    endpoints:
      - protocol: openai
        base_url: https://api.moonshot.cn/v1
    models: [deepseek-chat]

# 模型（逻辑层）：对外模型名 + 候选实例链 + 分流策略。
models:
  # 单实例
  - name: MiniMax-M3.1-Flash
    upstream: MiniMax-M3.1-Flash
    strategy: failover
    instances:
      - name: minimax-cn

  # 主备：priority 越小越优先，主实例失败后自动切到下一个
  - name: MiniMax-M3.1-Flash[1m]
    upstream: MiniMax-M3.1-Flash
    strategy: failover
    instances:
      - name: minimax-cn
        priority: 0
      - name: minimax-cn-backup
        priority: 1

  # 别名：对外叫 claude-sonnet-4-5，上游仍是 glm-4.6
  - name: claude-sonnet-4-5
    upstream: glm-4.6
    strategy: failover
    instances:
      - name: glm

  # 时间窗口（峰谷计费）：厂商在特定时段打折时，让便宜的候选在那段时间插队。
  # 时间按上面的 schedule.timezone 判定，窗口是左闭右开 [start, end)，
  # 起晚于止视为跨天（如 "22:00" - "06:00"）。
  - name: deepseek-chat
    upstream: deepseek-chat
    strategy: failover
    instances:
      # 谷时折扣时段内生效优先级降到 0，抢到最前面
      - name: deepseek
        priority: 10
        windows:
          - start: "00:00"
            end: "08:00"
            priority: 0
      # 平时用另一个厂商
      - name: moonshot
        priority: 1
        # only: true 表示这个候选只在窗口内参与路由，窗口外直接跳过；
        # 完整示例见 docs/routing.md 的「按时段调度候选」一节。

# 可选。USD per million tokens，仅用于成本估算。
pricing:
  MiniMax-M3.1-Flash:
    input_per_mtok: 0.3
    output_per_mtok: 1.2
  glm-4.6:
    input_per_mtok: 0.6
    output_per_mtok: 2.2
