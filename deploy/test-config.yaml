# Local test environment: gateway + deterministic mock upstream.
# Credentials here are test-only; never reuse them in production.
#
# The topology below mirrors the production deployment (same instance names,
# same candidate chains, same session/failover settings) so a local run
# exercises the real routing shape. Every upstream points at the mock, and
# the mock's api_key switches the behaviour it plays:
#
#   mock-upstream-key      normal answer
#   mock-quota             402 Payment Required (exhausted plan window)
#   mock-session-required  400 MissingSessionID unless x-opencode-session is sent

server:
  addr: ":8080"
  admin_username: admin
  admin_password: "test-admin-password"
  metrics_token: "test-metrics-token"
  session_ttl: 2h
  # compose 里没有反代，只有容器内自访会命中 127.0.0.1。外部来源的
  # X-Forwarded-For 一律不采信。
  trusted_proxies: ["127.0.0.1/32"]
  secure_cookie: false

  # 管理面开关：改成 false 就能在 1 秒内热加载关掉控制台（应急拉闸）。
  admin_enabled: true

  # 管理面白名单。192.168.222.1 是 compose 网络的网关，也就是宿主机访问
  # 发布端口时容器看到的来源地址（网段在 docker-compose.test.yml 里固定）。
  # 127.0.0.1/32 覆盖容器内自访。白名单外的来源访问 /admin/api/* 返回 403。
  admin_allowed_cidrs: ["192.168.222.1/32", "127.0.0.1/32", "::1/128"]

  # 单把网关 Key 的预算。测试环境留得宽松，但仍然开启，方便验证 429 行为。
  key_rpm: 600
  key_max_concurrent: 32

database:
  path: "/data/llmgw.db"
  # 请求日志、审计日志与按日用量保留 7 天。
  retention_days: 7

log:
  level: debug
  format: text

# 时间窗口的判定时区：所有窗口共用这一个。
schedule:
  timezone: "Asia/Shanghai"

# 四个接入点与生产同名，端点全部指向 mock。
instances:
  # 生产：MiniMax 编码套餐（国内）。用 mock-quota 复现「5 小时窗口打满」。
  # failover_statuses: [402] 让它命中后切到下一个候选，而不是直接透传。
  - name: minimax
    api_key: "mock-quota"
    allow_private_upstream: true
    endpoints:
      - protocol: openai
        base_url: http://mock:8000
      - protocol: anthropic
        base_url: http://mock:8000
    models: [MiniMax-M3, MiniMax-M3.1-Flash, minimax-m3.1-flash]
    # 生产里把这台的冷却调到了 1 小时（额度耗尽后不要每 5 分钟重试）
    max_fails: 3
    cooldown_secs: 3600
    failover_statuses: [402]

  # 生产：火山方舟 Coding Plan。mock 正常应答。
  - name: fangzhou
    api_key: "mock-upstream-key"
    allow_private_upstream: true
    endpoints:
      - protocol: openai
        base_url: http://mock:8000
      - protocol: anthropic
        base_url: http://mock:8000
    models: [deepseek-v4.1-flash, glm-5.3-flash]

  # 生产：OpenCode Go。mock-session-required 复现「缺 x-opencode-session 就 400」。
  # 网关在客户端没带该头时按对话前缀派生稳定值注入，所以普通调用应当成功；
  # 万一仍被拒，failover_statuses: [400] 允许切到下一个候选。
  - name: opencode-go
    api_key: "mock-session-required"
    allow_private_upstream: true
    session_header: x-opencode-session
    endpoints:
      - protocol: openai
        base_url: http://mock:8000
      - protocol: anthropic
        base_url: http://mock:8000
    models:
      [deepseek-v4.1-flash, glm-5.3-flash, kimi-k3, minimax-m3, MiniMax-M3.1-Flash, minimax-m3.1-flash]
    failover_statuses: [400]

  # 生产：自定义接入点（内网 magpie）。测试环境同样走内网 mock，
  # 上游模型名保留 workbuddy/ 前缀，验证候选级 upstream 的映射。
  - name: workbuddy
    api_key: "mock-upstream-key"
    allow_private_upstream: true
    endpoints:
      - protocol: openai
        base_url: http://mock:8000
      - protocol: anthropic
        base_url: http://mock:8000
    models: [workbuddy/deepseek-v4.1-flash, workbuddy/glm-5.3-flash]

# 对外模型与候选链与生产一致。
models:
  # 生产：opencode-go p0 → workbuddy p1 → fangzhou p2
  - name: deepseek-v4.1-flash
    instances:
      - name: opencode-go
        upstream: deepseek-v4.1-flash
        priority: 0
      - name: workbuddy
        upstream: workbuddy/deepseek-v4.1-flash
        priority: 1
      - name: fangzhou
        upstream: deepseek-v4.1-flash
        priority: 2

  # 生产：minimax p0 → opencode-go p1。
  # minimax 在测试环境固定返回 402，所以这条链每次都会走到 opencode-go，
  # 正好验证「402 触发切换 + 会话头注入」两个行为。
  - name: MiniMax-M3.1-Flash
    instances:
      - name: minimax
        upstream: MiniMax-M3.1-Flash
        priority: 0
      - name: opencode-go
        upstream: MiniMax-M3.1-Flash
        priority: 1

  # 生产：fangzhou 与 workbuddy 同为 p0，平局按写入顺序取 fangzhou；
  # opencode-go 为 p1 备选。
  # metadata 用来验证 /openai/v1/models 与 /anthropic/v1/models 的扩展字段。
  - name: glm-5.3-flash
    metadata:
      display_name: GLM-5.3-Flash
      context_length: 1048576
      max_output_tokens: 131072
      capabilities: [tools, reasoning, json, cache, vision, video, doc]
    instances:
      - name: fangzhou
        upstream: glm-5.3-flash
        priority: 0
      - name: workbuddy
        upstream: workbuddy/glm-5.3-flash
        priority: 0
      - name: opencode-go
        upstream: glm-5.3-flash
        priority: 1

pricing:
  MiniMax-M3.1-Flash:
    input_per_mtok: 0.3
    output_per_mtok: 1.2
  deepseek-v4.1-flash:
    input_per_mtok: 0.15
    output_per_mtok: 0.6
  glm-5.3-flash:
    input_per_mtok: 0.6
    output_per_mtok: 2.2
