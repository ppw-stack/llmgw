server:
  addr: ":8080"
  admin_username: "admin"
  # 留空则首次启动生成随机密码，打印一次并写入 data/admin-password.txt
  admin_password: ""
  session_ttl: 12h
  # 反向代理终止 TLS 时，把反代地址加入可信列表，用于解析真实客户端 IP
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  # 反代未传 X-Forwarded-Proto 时，可强制 Cookie 带 Secure
  secure_cookie: false
  # 可选：为 /metrics 设置访问令牌；留空则公开
  metrics_token: ""
  read_header_timeout: 10s
  shutdown_timeout: 30s
  max_body_bytes: 33554432

database:
  path: "./data/llmgw.db"

log:
  level: info
  format: json

providers:
  - name: glm
    keys:
      - "${GLM_KEY_1}"
      - "${GLM_KEY_2}"
    timeout: 120s
    endpoints:
      - name: openai
        protocol: openai
        base_url: https://open.bigmodel.cn/api/paas/v4
        models:
          glm-4.6: glm-4.6
      - name: anthropic
        protocol: anthropic
        base_url: https://open.bigmodel.cn/api/anthropic
        version: "2023-06-01"
        models:
          glm-4.6: glm-4.6

  - name: deepseek
    keys: ["${DEEPSEEK_KEY}"]
    endpoints:
      - name: openai
        protocol: openai
        base_url: https://api.deepseek.com/v1
        models:
          deepseek-chat: deepseek-chat

# Optional. USD per million tokens, used only for cost estimates.
pricing:
  glm-4.6:
    input_per_mtok: 0.6
    output_per_mtok: 2.2
  deepseek-chat:
    input_per_mtok: 0.27
    output_per_mtok: 1.1
